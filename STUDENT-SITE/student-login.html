<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | UniVote</title>

    <link rel="stylesheet" href="student.css">
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <div class="logo">
                C
            </div>

            <h1>Welcome to CollegeVote</h1>

            <p class="subtitle">
                Student Voting Portal
            </p>

            <div id="message" class="message"></div>

            <form id="loginForm">

                <div class="form-group">

                    <label for="matricNumber">
                        Matric Number
                    </label>

                    <input
                        type="text"
                        id="matricNumber"
                        placeholder="Enter your matric number"
                        autocomplete="username"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="toggle-password"
                        >
                            Show
                        </button>

                    </div>

                </div>

                <button
                    type="submit"
                    id="loginBtn"
                    class="login-btn"
                >
                    Login
                </button>

            </form>

            <!-- RESET PASSWORD -->

            <div class="forgot-password">

                <a href="student-reset-password.html">
                    Forgot your password?
                </a>

            </div>

            <div class="register-section">

                <p>
                    First time here?
                </p>

                <a href="student-register.html">
                    Create your student account
                </a>

            </div>

            <a
                href="index.html"
                class="back-link"
            >
                ← Back to Home
            </a>

        </section>

    </main>

    <script src="student-login.js"></script>

</body>
</html>
