<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password | UniVote</title>

    <link
        rel="stylesheet"
        href="student-reset-password.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>


<body>


    <main class="reset-page">


        <section class="reset-card">


            <!-- =========================
                 LOGO
            ========================== -->

            <div class="logo">
                U
            </div>


            <h1>
                Reset Your Password
            </h1>


            <p class="subtitle">
                Enter your matric number and registered email
                to create a new password.
            </p>


            <!-- =========================
                 MESSAGE
            ========================== -->

            <div
                id="message"
                class="message"
            ></div>


            <!-- =========================
                 RESET FORM
            ========================== -->

            <form
                id="resetPasswordForm"
                novalidate
            >


                <!-- MATRIC NUMBER -->

                <div class="form-group">

                    <label for="matricNumber">
                        Matric Number
                    </label>

                    <input
                        type="text"
                        id="matricNumber"
                        placeholder="Enter your matric number"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Registered Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your registered email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- NEW PASSWORD -->

                <div class="form-group">

                    <label for="newPassword">
                        New Password
                    </label>


                    <div class="password-box">

                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Enter new password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="newPassword"
                        >
                            Show
                        </button>

                    </div>

                    <small>
                        Password must be at least 8 characters.
                    </small>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm New Password
                    </label>


                    <div class="password-box">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm new password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="confirmPassword"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- RESET BUTTON -->

                <button
                    type="submit"
                    id="resetBtn"
                    class="reset-btn"
                >
                    Reset Password
                </button>


            </form>


            <!-- =========================
                 SECURITY NOTE
            ========================== -->

            <div class="security-note">

                🔐 Your password is securely protected.

            </div>


            <!-- =========================
                 BACK TO LOGIN
            ========================== -->

            <a
                href="student.html"
                class="back-link"
            >
                ← Back to Student Login
            </a>


        </section>


    </main>


    <footer>

        <p>
            © 2026 UniVote — University E-Voting System
        </p>

    </footer>


    <script src="student-reset-password.js"></script>

</body>

</html>
