<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | UniVote</title>

    <link
        rel="stylesheet"
        href="admin-forgot-password.css"
    >

</head>

<body>

    <main class="forgot-container">

        <div class="forgot-card">

            <div class="logo">
                🗳️
            </div>

            <h1>
                Forgot Password?
            </h1>

            <p class="subtitle">
                Enter your admin Gmail address and we'll
                send you a 4-digit verification code.
            </p>


            <form
                id="forgotPasswordForm"
                novalidate
            >

                <div class="form-group">

                    <label for="adminEmail">
                        Admin Gmail
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        name="adminEmail"
                        placeholder="Enter your Gmail address"
                        autocomplete="email"
                        required
                    >

                    <small
                        id="emailError"
                        class="error"
                    ></small>

                </div>


                <button
                    type="submit"
                    id="sendCodeBtn"
                >
                    Send Verification Code
                </button>

            </form>


            <div
                id="message"
                class="message"
            ></div>


            <a
                href="admin-login.html"
                class="back-link"
            >
                ← Back to Admin Login
            </a>

        </div>

    </main>


    <script src="admin-forgot-password.js"></script>

</body>

</html>
