<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Verify Code | UniVote</title>

    <link
        rel="stylesheet"
        href="admin-verify-password.css"
    >

</head>

<body>

    <main class="verify-container">

        <div class="verify-card">

            <div class="logo">
                🔐
            </div>

            <h1>
                Verify Your Account
            </h1>

            <p class="subtitle">
                Enter the 4-digit verification code
                sent to your Gmail.
            </p>


            <form
                id="verifyPasswordForm"
                novalidate
            >

                <div class="form-group">

                    <label for="verificationCode">
                        Verification Code
                    </label>

                    <input
                        type="text"
                        id="verificationCode"
                        name="verificationCode"
                        placeholder="0000"
                        inputmode="numeric"
                        maxlength="4"
                        autocomplete="one-time-code"
                        required
                    >

                    <small
                        id="codeError"
                        class="error"
                    ></small>

                </div>


                <div class="form-group">

                    <label for="newPassword">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        name="newPassword"
                        placeholder="Enter new password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm new password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                    <small
                        id="passwordError"
                        class="error"
                    ></small>

                </div>


                <button
                    type="submit"
                    id="verifyBtn"
                >
                    Verify & Reset Password
                </button>

            </form>


            <p
                id="message"
                class="message"
            ></p>


            <a
                href="admin-forgot-password.html"
                class="back-link"
            >
                ← Back
            </a>

        </div>

    </main>


    <script src="admin-verify-password.js"></script>

</body>

</html>
