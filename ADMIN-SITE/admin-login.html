<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | UniVote</title>

    <link
        rel="stylesheet"
        href="admin-login.css"
    >

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>

<body>

    <main class="admin-login-page">

        <section class="admin-login-card">

            <!-- BRAND -->

            <div class="brand">

                <div class="brand-icon">
                    C
                </div>

                <div>

                    <h1>
                        CollegeVote
                    </h1>

                    <span>
                        College E-Voting System
                    </span>

                </div>

            </div>


            <!-- ADMIN BADGE -->

            <div class="admin-badge">
                ADMINISTRATOR PORTAL
            </div>


            <!-- HEADER -->

            <div class="login-header">

                <h2>
                    Admin Login
                </h2>

                <p>
                    Sign in to manage elections,
                    students, candidates and results.
                </p>

            </div>


            <!-- FORM -->

            <form
                id="adminLoginForm"
                novalidate
            >


                <!-- USERNAME -->

                <div class="form-group">

                    <label for="adminUsername">
                        Admin Username
                    </label>

                    <input
                        type="text"
                        id="adminUsername"
                        placeholder="Enter admin username"
                        autocomplete="username"
                    >

                    <small
                        class="error-message"
                        id="usernameError">
                    </small>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="adminPassword">
                        Password
                    </label>


                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="adminPassword"
                            placeholder="Enter admin password"
                            autocomplete="current-password"
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="toggle-password"
                        >
                            Show
                        </button>

                    </div>


                    <small
                        class="error-message"
                        id="passwordError">
                    </small>

                </div>


                <!-- REMEMBER -->

                <div class="remember-row">

                    <label>

                        <input
                            type="checkbox"
                            id="rememberAdmin"
                        >

                        <span>
                            Remember username
                        </span>

                    </label>

                </div>


                <!-- LOGIN -->

                <button
                    type="submit"
                    id="adminLoginBtn"
                    class="login-btn"
                >
                    Login to Admin Panel
                </button>


            </form>


            <!-- SECURITY -->

            <div class="security-note">

                🔐 Restricted administrator access

            </div>


            <!-- BACK -->

            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Home
            </a>

        </section>

    </main>


    <footer>

        <p>
            © 2026 UniVote — University E-Voting System
        </p>

    </footer>


    <script src="admin-login.js"></script>

</body>

</html>
